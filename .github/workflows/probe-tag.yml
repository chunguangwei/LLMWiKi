name: Tag-context release probe (one-off)

# Discriminator: the v0.9.1 build (tag push) failed at create-a-release with
# 403, while the workflow_dispatch probe on main created a release fine.
# This runs the identical API call under the SAME event context (tag push)
# without the 45-minute build, isolating event context from time/incident.

on:
  push:
    tags:
      - 'probe-*'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Create and delete a draft release for this tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -x
          ID=$(gh api "repos/${{ github.repository }}/releases" \
            -F tag_name="${{ github.ref_name }}" -F draft=true -F name=probe \
            --jq .id)
          echo "created release id=$ID"
          gh api -X DELETE "repos/${{ github.repository }}/releases/$ID"
