name: Permission probe (one-off)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Try creating a draft release with GITHUB_TOKEN
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/${{ github.repository }}/releases \
            -F tag_name=perm-probe -F draft=true -F name=perm-probe \
            --jq '.id' && gh api -X DELETE repos/${{ github.repository }}/releases/$(gh api repos/${{ github.repository }}/releases/tags/perm-probe --jq .id)
