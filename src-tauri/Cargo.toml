[package]
name = "llm-wiki"
version = "0.4.29"
description = "LLM Wiki - A personal knowledge base for LLM concepts"
authors = []
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "llm_wiki_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "llm-wiki"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["clock"] }
tauri-plugin-dialog = "2.7.1"
pdfium-render = "0.9"
tauri-plugin-store = "2.4.2"
tauri-plugin-http = { version = "2", features = ["unsafe-headers"] }
# In-place auto-update from our own GitHub releases (signed with the
# updater minisign keypair; pubkey lives in tauri.conf.json). `process`
# provides relaunch() after a successful install.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# Encrypted config backup / portable export. argon2id derives a key
# from the user's passphrase (export/import); aes-gcm is the AEAD
# cipher; keyring holds the random auto-backup data key in the OS
# keychain (survives an app-data wipe so a same-machine reinstall can
# auto-restore). zeroize wipes key material from memory after use.
# secret-service uses pure-Rust zbus + crypto-rust so Linux CI compiles
# without libdbus / openssl system headers.
argon2 = "0.5"
aes-gcm = "0.10"
rand = "0.8"
zeroize = "1"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tiny_http = "0.12"
zip = "2"
calamine = "0.34.0"
docx-rs = "0.4.20"
# Reads .epub files: walks the OPF spine and pulls each XHTML chapter
# in reading order. EPUB is just a zip + XML manifest, but the crate
# handles the spec corners (container.xml → rootfile → spine, relative
# href resolution against the OPF's directory, etc.) so we don't have
# to roll our own.
epub = "2"
lancedb = "0.27.2"
# tokio provided by tauri runtime for async commands
arrow-array = "57"
arrow-schema = "57"
futures = "0.3"
# Claude Code CLI subprocess transport: spawn `claude` as a child process,
# stream stdout line-by-line back to the frontend. tokio::process gives us
# async io and clean cancellation; `which` locates the binary on PATH.
tokio = { version = "1", features = ["process", "io-util", "sync", "macros", "rt"] }
which = "7"
uuid = { version = "1", features = ["v4"] }
# Multimodal image extraction (Phase 1):
#   `image` re-encodes pdfium's raw bitmap output to PNG so the IPC
#   payload is self-contained (the frontend doesn't need to know
#   about pdfium's internal RGBA layout).
#   `base64` serializes binary image data for Tauri IPC, which is
#   JSON-only — Vec<u8> roundtrips ~1.33× larger than raw bytes but
#   that's acceptable for our ~MB-scale per-image payloads.
#   `sha2` is for the dedup cache (Phase 3) — same image hash =
#   same caption, no redundant VLM calls. Pulled in here so the
#   extraction layer can also expose the hash if a caller wants it.
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.22"
sha2 = "0.10"
md-5 = "0.10"
notify = "8"
walkdir = "2"
# Desktop single-instance guard: when a second copy of the app is
# launched, focus the already-running window instead of spinning up a
# rival process that would fight over the clip/API server ports
# (19827/19828). Must be registered as the FIRST plugin. Desktop-only —
# the crate doesn't build for mobile targets.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
# Used by commands/storage.rs for statfs-based network-mount detection
# on macOS and Linux. Windows path takes a different code path that
# does not need libc.
[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
# Unwind (not abort) so third-party parser panics can be caught at the
# Tauri command boundary via panic_guard and turned into errors. Slightly
# larger binary, but prevents single-file corruption from killing the app.
panic = "unwind"
strip = true
